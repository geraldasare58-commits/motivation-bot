name: Motivation Bot

on:
  schedule:
    # Runs at 00:00 (12 AM) and 12:00 (12 PM) UTC every day
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering anytime for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome executable
        run: npx puppeteer browsers install chrome

      - name: Run bot script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node bot.js