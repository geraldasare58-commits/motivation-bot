name: Run Motivation Bot

on:
  schedule:
    - cron: '0 0,12 * * *' # Runs every day at 12:00 AM and 12:00 PM UTC
  workflow_dispatch: # Lets you run it manually from GitHub anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node bot.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}